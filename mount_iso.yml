---
# Montar ISO en VM existente
- hosts: localhost
  gather_facts: no
  connection: local
  become: no
  collections: [community.vmware]
  
  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"
  
  tasks:
    - name: "🔑 Obtener credenciales"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
    
    - name: "💿 Apagar VM para montar ISO"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        state: powered-off
      ignore_errors: yes
    
    - name: "⏸️ Esperar 10 segundos"
      pause:
        seconds: 10
    
    - name: "💿 Montar ISO en CD-ROM"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        esxi_hostname: "{{ vault_vcenter.esxi_hostname_fqdn }}"
        datacenter: "ha-datacenter"
        name: "{{ vm_name }}"
        state: present
        cdrom:
          - controller_number: 0
            unit_number: 0
            controller_type: ide
            type: iso
            iso_path: "{{ iso_path }}"
            state: present
    
    - name: "⚡ Encender VM con ISO montado"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        state: powered-on
    
    - name: "✅ Completado"
      debug:
        msg: "ISO {{ iso_path }} montado en {{ vm_name }} - Reinicia la VM para bootear desde CD"
