---
# ╔══════════════════════════════════════════════════════════════╗
# ║  ROL: USER AUDIT - Auditoría de Usuarios                   ║
# ║  Propósito: Generar reportes de usuarios y permisos        ║
# ║  Tipo: Custom ligero (solo reportes)                        ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "📊 Obtener información de usuarios del sistema"
  getent:
    database: passwd
  register: system_passwd
  tags:
    - audit

- name: "📊 Obtener información de grupos del sistema"
  getent:
    database: group
  register: system_groups
  tags:
    - audit

- name: "📊 Obtener configuración de sudo"
  find:
    paths: /etc/sudoers.d
    patterns: "*"
  register: sudoers_files
  tags:
    - audit

- name: "📊 Leer archivos de sudoers"
  slurp:
    src: "{{ item.path }}"
  register: sudoers_content
  loop: "{{ sudoers_files.files }}"
  when: sudoers_files.files | length > 0
  tags:
    - audit

- name: "📊 Obtener usuarios con SSH keys"
  find:
    paths: /home
    patterns: "authorized_keys"
    recurse: yes
    file_type: file
  register: ssh_keys_found
  tags:
    - audit

- name: "📝 Crear directorio de reportes si no existe"
  file:
    path: "{{ user_audit_report_path }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: no
  run_once: yes
  tags:
    - audit

- name: "📄 Generar reporte de auditoría de usuarios"
  template:
    src: user_report.txt.j2
    dest: "{{ user_audit_report_path }}/user_audit_{{ inventory_hostname }}_{{ ansible_date_time.epoch }}.txt"
    mode: '0644'
  delegate_to: localhost
  become: no
  tags:
    - audit

- name: "✅ Reporte generado"
  debug:
    msg: |
      ════════════════════════════════════════════════════════════
      📊 REPORTE DE AUDITORÍA GENERADO
      ════════════════════════════════════════════════════════════
      Host: {{ inventory_hostname }}
      Archivo: {{ user_audit_report_path }}/user_audit_{{ inventory_hostname }}_{{ ansible_date_time.epoch }}.txt
      Usuarios analizados: {{ system_passwd.ansible_facts.getent_passwd | length }}
      Grupos analizados: {{ system_groups.ansible_facts.getent_group | length }}
      ════════════════════════════════════════════════════════════
  tags:
    - audit
