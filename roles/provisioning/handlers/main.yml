# ════════════════════════════════════════════════════════════════════════════
# 🔄 HANDLERS PARA PROVISIONING
# ════════════════════════════════════════════════════════════════════════════

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: restart docker
  systemd:
    name: docker
    state: restarted
  become: yes

- name: restart postgresql
  systemd:
    name: postgresql
    state: restarted
  become: yes

- name: restart prometheus
  systemd:
    name: prometheus
    state: restarted
  become: yes
