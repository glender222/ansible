---
# ════════════════════════════════════════════════════════════════════════════
# 🎯 ROL: PROVISIONING - Variables por defecto
# ════════════════════════════════════════════════════════════════════════════

# Software base mínimo
default_base_packages:
  - git
  - curl
  - wget
  - vim
  - htop

# Configuración por defecto
default_profile: minimal
default_update_system: true
default_verify_services: true

# Requisitos mínimos por perfil
minimum_requirements:
  web_server:
    memory_mb: 512
    disk_gb: 5
  database:
    memory_mb: 1024
    disk_gb: 10
  minimal:
    memory_mb: 256
    disk_gb: 3
