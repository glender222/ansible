---
# ════════════════════════════════════════════════════════════════════════════
# 💻 PERFIL: DEVELOPMENT (Ambiente de desarrollo)
# ════════════════════════════════════════════════════════════════════════════

- name: "💻 Instalando herramientas de desarrollo"
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - nodejs
      - npm
      - default-jdk
      - maven
    state: present
  become: yes

- name: "📦 Instalar paquetes globales de npm"
  npm:
    name: "{{ item }}"
    global: yes
    state: present
  become: yes
  loop:
    - yarn
    - typescript
    - nodemon
  ignore_errors: yes

- name: "✅ Verificar versiones instaladas"
  shell: |
    echo "Python: $(python3 --version)"
    echo "Node.js: $(node --version)"
    echo "npm: $(npm --version)"
    echo "Java: $(java -version 2>&1 | head -1)"
    echo "Maven: $(mvn --version | head -1)"
  register: dev_versions
  changed_when: false

- name: "📊 Versiones de herramientas"
  debug:
    msg: "{{ dev_versions.stdout_lines }}"
