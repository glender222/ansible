---
# Crear VM con ISO montado y configuración ligera
- hosts: localhost
  gather_facts: no
  connection: local
  become: no
  collections: [community.vmware]
  
  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"
    
    # Valores por defecto (sobrescribir con -e)
    vm_memory_mb: 4096
    vm_cpus: 2
    vm_disk_gb: 20
    vm_os_type: "ubuntu64Guest"  # Para Linux / "windows9_64Guest" para Windows
  
  tasks:
    - name: "🔑 Obtener credenciales desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
    
    - name: "🖥️ Crear VM con ISO montado"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        esxi_hostname: "{{ vault_vcenter.esxi_hostname_fqdn }}"
        datacenter: "ha-datacenter"
        folder: "/"
        name: "{{ vm_name }}"
        state: poweredon
        guest_id: "{{ vm_os_type }}"
        datastore: "{{ vault_vcenter.datastore }}"
        hardware:
          memory_mb: "{{ vm_memory_mb }}"
          num_cpus: "{{ vm_cpus }}"
          boot_firmware: "bios"
        disk:
          - size_gb: "{{ vm_disk_gb }}"
            type: thin
            datastore: "{{ vault_vcenter.datastore }}"
        networks:
          - name: "{{ vault_vcenter.default_portgroup }}"
            device_type: vmxnet3
        cdrom:
          - controller_number: 0
            unit_number: 0
            type: iso
            iso_path: "{{ iso_path }}"
            state: present
        wait_for_ip_address: no
      register: vm_created
    
    - name: "✅ VM creada"
      debug:
        msg: "VM {{ vm_name }} creada exitosamente con ISO {{ iso_path }}"
