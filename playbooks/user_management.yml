---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MÓDULO 1: GESTIÓN DE USUARIOS Y PERMISOS                   ║
# ║  Versión: 1.0.0                                             ║
# ║  Uso: ansible-playbook main.yml -e "mode=users"            ║
# ║  Requiere: Vault activo + VMs Linux en vCenter              ║
# ╚══════════════════════════════════════════════════════════════╝

# ═══════════════════════════════════════════════════════════════
# FASE 1: OBTENER VMs DESDE VCENTER
# ═══════════════════════════════════════════════════════════════

- name: "📡 Fase 1: Obtener información de VMs desde vCenter"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  
  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"
  
  tasks:
    - name: "👥 Banner del Módulo 1"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         👥 GESTIÓN DE USUARIOS Y PERMISOS                  ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Fase 1: Obtener VMs desde vCenter                          ║
          ║ Fase 2: Crear grupos del sistema                           ║
          ║ Fase 3: Crear usuarios con permisos                        ║
          ║ Fase 4: Configurar sudo                                    ║
          ║ Fase 5: Generar reporte de auditoría                       ║
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always
    
    - name: "🔑 Obtener credenciales de vCenter desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
      tags:
        - always
    
    - name: "📋 Obtener lista de VMs Linux desde vCenter"
      community.vmware.vmware_vm_info:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
      register: vms_info
      tags:
        - always
    
    - name: "🐧 Filtrar VMs Linux activas"
      set_fact:
        active_linux_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Linux.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "🪟 Filtrar VMs Windows activas"
      set_fact:
        active_windows_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Windows.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "📊 Mostrar VMs encontradas"
      debug:
        msg: |
          VMs Linux activas encontradas: {{ active_linux_vms | length }}
          {% for vm in active_linux_vms %}
          - {{ vm.guest_name }} ({{ vm.ip_address | default('Sin IP') }})
          {% endfor %}
          VMs Windows activas encontradas: {{ active_windows_vms | length }}
          {% for vm in active_windows_vms %}
          - {{ vm.guest_name }} ({{ vm.ip_address | default('Sin IP') }})
          {% endfor %}
      tags:
        - always
    
    - name: "⚠️ Advertencia si no hay VMs"
      fail:
        msg: "No se encontraron VMs activas (Linux o Windows) en vCenter"
      when: (active_linux_vms | length == 0) and (active_windows_vms | length == 0)
      tags:
        - always

    - name: "Registrar VMs Linux con IP en el inventario temporal"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_linux
        ansible_user: "{{ item.guest_user | default('root') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
      loop: "{{ active_linux_vms }}"
      when: item.ip_address | length > 0
      tags:
        - always

    - name: "Registrar VMs Windows con IP en el inventario temporal"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_windows
        ansible_user: "{{ item.guest_user | default('Administrator') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
        ansible_connection: winrm
        ansible_winrm_server_cert_validation: ignore
      loop: "{{ active_windows_vms }}"
      when: item.ip_address | length > 0
      tags:
        - always

# ═══════════════════════════════════════════════════════════════
# FASE 2-4: GESTIÓN DE USUARIOS EN VMs
# ═══════════════════════════════════════════════════════════════

- name: "🔧 Fase 2-4: Aplicar configuración de usuarios"
  hosts: vms_linux
  gather_facts: yes
  become: yes
  
  vars:
    # Cargar variables de usuarios
    users_group_list: "{{ system_groups | map(attribute='name') | map('dict_from_list', ['name']) | list }}"
    users_user_list: "{{ system_users }}"
  
  pre_tasks:
    - name: "🎯 Mostrar host objetivo"
      debug:
        msg: "Configurando usuarios en: {{ inventory_hostname }}"
      tags:
        - always
  
  roles:
    # ═══════════════════════════════════════════════════════════
    # ROL 1: GALAXY - Gestión de Usuarios y Grupos
    # ═══════════════════════════════════════════════════════════
    - role: robertdebock.users
      vars:
        users_groups: "{{ system_groups }}"
        users: "{{ system_users }}"
      tags:
        - users
        - groups
    
    # ═══════════════════════════════════════════════════════════
    # ROL 2: GALAXY - Configuración de Sudo
    # ═══════════════════════════════════════════════════════════
    - role: linux-system-roles.sudo
      vars:
        sudo_users: "{{ system_users | selectattr('sudo_options', 'defined') | list }}"
      tags:
        - sudo
        - security
  
  post_tasks:
    - name: "✅ Usuarios configurados correctamente"
      debug:
        msg: |
          ════════════════════════════════════════════════════════
          Configuración de usuarios completada en {{ inventory_hostname }}
          ════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════
# FASE 2-4: GESTIÓN DE USUARIOS EN VMs WINDOWS
# ═══════════════════════════════════════════════════════════════

- name: "🔧 Fase 2-4: Aplicar configuración de usuarios en Windows"
  hosts: vms_windows
  gather_facts: yes

  vars:
    # Cargar variables de usuarios
    win_groups: "{{ system_groups | selectattr('win_group', 'defined') | list }}"
    win_users: "{{ system_users | selectattr('win_user', 'defined') | list }}"

  pre_tasks:
    - name: "🎯 Mostrar host objetivo"
      debug:
        msg: "Configurando usuarios en: {{ inventory_hostname }}"
      tags:
        - always

  tasks:
    - name: "Crear grupos en Windows"
      ansible.windows.win_group:
        name: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ win_groups }}"
      tags:
        - users
        - groups
        - windows

    - name: "Crear usuarios en Windows"
      ansible.windows.win_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        groups: "{{ item.groups }}"
        state: present
      loop: "{{ win_users }}"
      tags:
        - users
        - windows

# ═══════════════════════════════════════════════════════════════
# FASE 5: AUDITORÍA Y REPORTES
# ═══════════════════════════════════════════════════════════════

- name: "📊 Fase 5: Generar reporte de auditoría en Linux"
  hosts: vms_linux
  gather_facts: yes
  become: yes
  
  roles:
    - role: user_audit
      when: user_audit_enabled | default(true)
      tags:
        - audit
        - reports
        - linux

- name: "📊 Fase 5: Generar reporte de auditoría en Windows"
  hosts: vms_windows
  gather_facts: yes

  tasks:
    - name: "Obtener usuarios locales"
      ansible.windows.win_shell: Get-LocalUser | Select-Object Name, Enabled, LastLogon | ConvertTo-Json
      register: windows_users

    - name: "Crear directorio de reportes"
      delegate_to: localhost
      file:
        path: "reports/users/{{ inventory_hostname }}"
        state: directory

    - name: "Guardar reporte"
      delegate_to: localhost
      copy:
        content: "{{ windows_users.stdout }}"
        dest: "reports/users/{{ inventory_hostname }}/user_audit.json"
  tags:
    - audit
    - reports
    - windows

# ═══════════════════════════════════════════════════════════════
# RESUMEN FINAL
# ═══════════════════════════════════════════════════════════════

- name: "✅ Resumen Final del Módulo 1"
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: "📋 Mostrar resumen"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║     ✅ MÓDULO 1 COMPLETADO EXITOSAMENTE                    ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Grupos creados en Linux: {{ system_groups | length }}
          ║ Usuarios creados en Linux: {{ system_users | length }}
          ║ Grupos creados en Windows: {{ win_groups | length }}
          ║ Usuarios creados en Windows: {{ win_users | length }}
          ║ Reportes generados en: reports/users/
          ║ 
          ║ Próximos pasos:
          ║ 1. Revisar reportes en reports/users/
          ║ 2. Validar acceso a usuarios
          ║ 3. Verificar permisos
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always
