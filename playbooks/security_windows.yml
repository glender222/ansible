---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MÓDULO 2: SEGURIDAD Y FIREWALL (WINDOWS)                   ║
# ║  Versión: 1.0.0                                             ║
# ║  Uso: ansible-playbook main.yml -e "mode=security_windows" ║
# ║  Requiere: Vault activo + VMs Windows en vCenter            ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "📡 Fase 1: Obtener información de VMs desde vCenter"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"

  tasks:
    - name: "🔐 Banner del Módulo 2"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         🔐 SEGURIDAD Y FIREWALL (WINDOWS)                  ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Fase 1: Obtener VMs desde vCenter                          ║
          ║ Fase 2: Aplicar configuración de seguridad                 ║
          ║ Fase 3: Generar reporte de seguridad                       ║
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always

    - name: "🔑 Obtener credenciales de vCenter desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
      tags:
        - always

    - name: "📋 Obtener lista de VMs Windows desde vCenter"
      community.vmware.vmware_vm_info:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
      register: vms_info
      tags:
        - always

    - name: "🪟 Filtrar VMs Windows activas"
      set_fact:
        active_windows_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Windows.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "Añadir VMs Windows al inventario"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_windows_security
        ansible_user: "{{ item.guest_user | default('Administrator') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
        ansible_connection: winrm
        ansible_winrm_server_cert_validation: ignore
      loop: "{{ active_windows_vms }}"
      when: item.ip_address is defined
      tags:
        - always

- name: "🔧 Fase 2: Aplicar configuración de seguridad"
  hosts: vms_windows_security
  gather_facts: yes

  tasks:
    - name: "Configurar regla de firewall para WinRM"
      ansible.windows.win_firewall:
        rule_name: "WinRM"
        local_port: "5985,5986"
        action: "allow"
        direction: "inbound"
        protocol: "TCP"
        state: "present"
        enabled: "yes"

    - name: "Bloquear todo el resto del tráfico entrante"
      ansible.windows.win_firewall:
        state: enabled
        policy:
          default_inbound_action: block

- name: "📊 Fase 3: Generar reporte de seguridad"
  hosts: vms_windows_security
  gather_facts: yes

  tasks:
    - name: "Obtener estado de firewall"
      ansible.windows.win_shell: Get-NetFirewallProfile | Select-Object Name, Enabled | Format-List
      register: firewall_status

    - name: "Crear directorio de reportes"
      delegate_to: localhost
      file:
        path: "reports/security/{{ inventory_hostname }}"
        state: directory

    - name: "Guardar reporte de seguridad"
      delegate_to: localhost
      copy:
        content: |
          Reporte de Seguridad para {{ inventory_hostname }}
          =======================================
          Firewall Status:
          {{ firewall_status.stdout }}
        dest: "reports/security/{{ inventory_hostname }}/security_report.txt"
  tags:
    - audit
    - reports
    - windows
