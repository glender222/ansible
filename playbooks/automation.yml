---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MÓDULO 3: AUTOMATIZACIÓN                                   ║
# ║  Versión: 1.0.0                                             ║
# ║  Uso: ansible-playbook main.yml -e "mode=automation"       ║
# ║  Requiere: Vault activo + VMs en vCenter                    ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "📡 Fase 1: Obtener información de VMs desde vCenter"
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"

  tasks:
    - name: "⚙️ Banner del Módulo 3"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         ⚙️ AUTOMATIZACIÓN                                  ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Fase 1: Obtener VMs desde vCenter                          ║
          ║ Fase 2: Aplicar configuración de automatización            ║
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always

    - name: "🔑 Obtener credenciales de vCenter desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
      tags:
        - always

    - name: "📋 Obtener lista de VMs desde vCenter"
      community.vmware.vmware_vm_info:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
      register: vms_info
      tags:
        - always

    - name: "🐧 Filtrar VMs Linux activas"
      set_fact:
        active_linux_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Linux.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "🪟 Filtrar VMs Windows activas"
      set_fact:
        active_windows_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Windows.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "Añadir VMs Linux al inventario"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_linux_automation
        ansible_user: "{{ item.guest_user | default('root') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
      loop: "{{ active_linux_vms }}"
      when: item.ip_address is defined
      tags:
        - always

    - name: "Añadir VMs Windows al inventario"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_windows_automation
        ansible_user: "{{ item.guest_user | default('Administrator') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
        ansible_connection: winrm
        ansible_winrm_server_cert_validation: ignore
      loop: "{{ active_windows_vms }}"
      when: item.ip_address is defined
      tags:
        - always

- name: "🔧 Fase 2: Aplicar configuración de automatización en Linux"
  hosts: vms_linux_automation
  gather_facts: yes
  become: yes

  roles:
    - role: geerlingguy.security
      vars:
        security_autoupdate_enabled: true
    - role: robertdebock.service
      vars:
        service_services:
          - name: cron
            state: started
            enabled: yes

  tasks:
    - name: "Programar apagado diario"
      cron:
        name: "Apagado diario"
        minute: "0"
        hour: "2"
        job: "/sbin/shutdown -h now"
        state: present

- name: "🔧 Fase 2: Aplicar configuración de automatización en Windows"
  hosts: vms_windows_automation
  gather_facts: yes

  tasks:
    - name: "Habilitar actualizaciones automáticas"
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: NoAutoUpdate
        data: 0
        type: dword

    - name: "Programar reinicio semanal"
      community.windows.win_scheduled_task:
        name: "Reinicio Semanal"
        actions:
          - path: "shutdown.exe"
            arguments: "/r /t 60"
        triggers:
          - type: weekly
            day_of_week: "Sunday"
            start_time: "03:00"
        state: present
        enabled: yes
