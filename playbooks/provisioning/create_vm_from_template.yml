---
- name: "Clonar VM desde Plantilla con Personalización"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"
    # --- Variables que debes proporcionar ---
    # -e "template_name=nombre-de-tu-plantilla"
    # -e "new_vm_name=nombre-de-la-nueva-vm"
    # -e "customization_spec=nombre-de-tu-especificacion" (Opcional, pero recomendado)

  tasks:
    - name: "🔑 Obtener credenciales de vCenter desde Vault"
      ansible.builtin.set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"

    - name: "② Clonar la VM desde la plantilla"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ new_vm_name }}"
        template: "{{ template_name }}"
        datacenter: "ha-datacenter"
        folder: "/"
        state: present
        hardware:
          memory_mb: 4096
          num_cpus: 2
        networks:
          - name: "{{ vault_vcenter.default_portgroup }}"
            device_type: vmxnet3
        customization:
          # Si proporcionas una especificación, se usará para configurar la red y el nombre de host.
          # Si no, se clonará tal cual.
          customization_spec: "{{ customization_spec | default(omit) }}"
      register: clone_task

    - name: "③ Encender la VM clonada"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ new_vm_name }}"
        state: poweredon
      when: clone_task.changed

    - name: "④ Esperar a que la VM obtenga una dirección IP"
      community.vmware.vmware_guest_info:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ new_vm_name }}"
      register: vm_info
      until: "vm_info.instance.ipv4 is defined and vm_info.instance.ipv4 != ''"
      retries: 30
      delay: 10
      when: clone_task.changed

    - name: "✅ Proceso Completado"
      ansible.builtin.debug:
        msg: |
          ¡VM '{{ new_vm_name }}' creada y lista!
          - Estado: Encendida
          - IP Asignada: {{ vm_info.instance.ipv4 }}
