---
# Playbook COMPLETO: Crear VM + Montar ISO + Configurar Boot + Encender
# Orden correcto para que bootee desde ISO automáticamente
- hosts: localhost
  gather_facts: no
  connection: local
  become: no
  collections:
    - community.vmware
  
  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"
    
    # Variables por defecto (sobrescribir con -e)
    vm_memory_mb: 4096
    vm_cpus: 2
    vm_disk_gb: 20
    vm_os_type: "ubuntu64Guest"  # o "windows9_64Guest" para Windows
    vm_boot_delay_ms: 5000
  
  tasks:
    - name: "🔑 Obtener credenciales desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
    
    - name: "📋 Paso 1/5: Crear VM (APAGADA)"
      debug:
        msg: "Creando VM {{ vm_name }} con {{ vm_disk_gb }}GB, {{ vm_memory_mb }}MB RAM, {{ vm_cpus }} CPUs..."
    
    - name: "🖥️ Crear VM base (estado: apagada)"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        esxi_hostname: "{{ vault_vcenter.esxi_hostname_fqdn }}"
        datacenter: "ha-datacenter"
        folder: "/"
        name: "{{ vm_name }}"
        state: present
        guest_id: "{{ vm_os_type }}"
        datastore: "{{ vault_vcenter.datastore }}"
        hardware:
          memory_mb: "{{ vm_memory_mb }}"
          num_cpus: "{{ vm_cpus }}"
          boot_firmware: "bios"
        disk:
          - size_gb: "{{ vm_disk_gb }}"
            type: thin
            datastore: "{{ vault_vcenter.datastore }}"
        networks:
          - name: "{{ vault_vcenter.default_portgroup }}"
            device_type: vmxnet3
        wait_for_ip_address: no
    
    - name: "📋 Paso 2/5: Asegurar que VM está apagada"
      debug:
        msg: "Apagando VM para montar ISO..."
    
    - name: "⚡ Apagar VM si está encendida"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        state: poweredoff
      ignore_errors: yes
    
    - name: "⏳ Esperar 3 segundos"
      pause:
        seconds: 3
    
    - name: "📋 Paso 3/5: Configurar boot order PRIMERO"
      debug:
        msg: "Configurando boot: 1.CD-ROM, 2.Disco, 3.Red..."
    
    - name: "⚙️ Configurar boot order (CD-ROM primero)"
      community.vmware.vmware_guest_boot_manager:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        boot_delay: "{{ vm_boot_delay_ms }}"
        boot_retry_enabled: true
        boot_retry_delay: 10000
        boot_order:
          - cdrom
          - disk
          - ethernet
    
    - name: "⏳ Esperar 3 segundos"
      pause:
        seconds: 3
    
    - name: "📋 Paso 4/5: Montar ISO en CD-ROM"
      debug:
        msg: "Montando ISO {{ iso_path }}..."
    
    - name: "💿 Montar ISO en CD-ROM"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        esxi_hostname: "{{ vault_vcenter.esxi_hostname_fqdn }}"
        datacenter: "ha-datacenter"
        name: "{{ vm_name }}"
        state: present
        cdrom:
          - controller_number: 0
            unit_number: 0
            type: iso
            iso_path: "{{ iso_path }}"
        force: yes
    
    - name: "⏳ Esperar 3 segundos"
      pause:
        seconds: 3
    
    - name: "Cycle power to ensure ISO is recognized"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        state: reboot-guest
      delegate_to: localhost

    - name: "📋 Paso 5/5: Encender VM para bootear desde ISO"
      debug:
        msg: "Encendiendo VM... debería bootear desde ISO"
    
    - name: "🚀 Encender VM"
      community.vmware.vmware_guest:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
        name: "{{ vm_name }}"
        state: poweredon
    
    - name: "✅ PROCESO COMPLETADO"
      debug:
        msg: |
          ════════════════════════════════════════════════════════════
          ✅ VM {{ vm_name }} LISTA PARA INSTALAR SO
          ════════════════════════════════════════════════════════════
          
          📋 Configuración:
            • Disco: {{ vm_disk_gb }} GB
            • RAM: {{ vm_memory_mb }} MB
            • CPUs: {{ vm_cpus }}
            • ISO montado: {{ iso_path }}
            • Boot order: CD-ROM → Disco → Red
          
          🎯 Estado actual:
            ✅ VM encendida
            ✅ Booteando desde ISO
            📺 Abre vCenter para ver la instalación
          
          🔗 vCenter Web: https://168.121.48.254:10107
          
          ⚠️  La VM ahora está instalando el SO desde la ISO
              Puedes monitorear el proceso en la consola de vCenter
          
          ════════════════════════════════════════════════════════════
