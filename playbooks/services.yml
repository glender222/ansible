---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MÓDULO 5: PROCESOS Y SERVICIOS                             ║
# ║  Versión: 1.0.0                                             ║
# ║  Uso: ansible-playbook main.yml -e "mode=services"         ║
# ║  Requiere: Vault activo + VMs en vCenter                    ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "📡 Fase 1: Obtener información de VMs desde vCenter"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  vars:
    vault_addr: "http://127.0.0.1:35013"
    vault_token: "root-token"

  tasks:
    - name: "⚙️ Banner del Módulo 5"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         ⚙️ PROCESOS Y SERVICIOS                             ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Fase 1: Obtener VMs desde vCenter                          ║
          ║ Fase 2: Gestionar servicios en Linux                       ║
          ║ Fase 3: Gestionar servicios en Windows                     ║
          ║ Fase 4: Generar reportes                                   ║
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always

    - name: "🔑 Obtener credenciales de vCenter desde Vault"
      set_fact:
        vault_vcenter: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/vcenter url=' + vault_addr + ' token=' + vault_token) }}"
      tags:
        - always

    - name: "📋 Obtener lista de VMs desde vCenter"
      community.vmware.vmware_vm_info:
        hostname: "{{ vault_vcenter.hostname }}"
        username: "{{ vault_vcenter.username }}"
        password: "{{ vault_vcenter.password }}"
        port: "{{ vault_vcenter.port }}"
        validate_certs: "{{ vault_vcenter.validate_certs }}"
      register: vms_info
      tags:
        - always

    - name: "🐧 Filtrar VMs Linux activas"
      set_fact:
        active_linux_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Linux.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "🪟 Filtrar VMs Windows activas"
      set_fact:
        active_windows_vms: "{{ vms_info.virtual_machines | selectattr('guest_fullname', 'match', '.*Windows.*') | selectattr('power_state', 'equalto', 'poweredOn') | list }}"
      tags:
        - always

    - name: "Registrar VMs Linux con IP en el inventario temporal"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_linux_services
        ansible_user: "{{ item.guest_user | default('root') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
      loop: "{{ active_linux_vms }}"
      when: item.ip_address | length > 0
      tags:
        - always

    - name: "Registrar VMs Windows con IP en el inventario temporal"
      add_host:
        name: "{{ item.ip_address }}"
        groups: vms_windows_services
        ansible_user: "{{ item.guest_user | default('Administrator') }}"
        ansible_password: "{{ item.guest_password | default(omit) }}"
        ansible_connection: winrm
        ansible_winrm_server_cert_validation: ignore
      loop: "{{ active_windows_vms }}"
      when: item.ip_address | length > 0
      tags:
        - always

- name: "🐧 Fase 2: Gestionar servicios en Linux"
  hosts: vms_linux_services
  become: yes
  gather_facts: yes

  roles:
    - role: robertdebock.service
      vars:
        service_services:
          - name: sshd
            state: started
            enabled: yes

- name: "🪟 Fase 3: Gestionar servicios en Windows"
  hosts: vms_windows_services
  gather_facts: yes

  tasks:
    - name: "Asegurarse de que el servicio de Windows Update esté iniciado"
      ansible.windows.win_service:
        name: wuauserv
        start_mode: auto
        state: started

- name: "📊 Fase 4: Generar reportes de servicios"
  hosts: vms_linux_services, vms_windows_services
  gather_facts: yes

  tasks:
    - name: "Obtener información de servicios"
      ansible.builtin.service_facts:
      register: service_facts

    - name: "Crear directorio de reportes"
      delegate_to: localhost
      file:
        path: "reports/services/{{ inventory_hostname }}"
        state: directory

    - name: "Guardar reporte de servicios"
      delegate_to: localhost
      copy:
        content: "{{ service_facts.ansible_facts.services | to_nice_json }}"
        dest: "reports/services/{{ inventory_hostname }}/services_report.json"
