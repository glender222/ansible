---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MAIN ROUTER - Punto de Entrada Principal de Ansible       ║
# ║  Versión: 2.0.0 - 100% HashiCorp Vault                      ║
# ║  Uso: ansible-playbook main.yml -e "mode=vmware"           ║
# ║  Requiere: Docker con Vault corriendo en puerto 8200       ║
# ╚══════════════════════════════════════════════════════════════╝

# 👥 MÓDULO 1: Gestión de Usuarios (import completo)
- import_playbook: playbooks/user_management.yml
  when: mode is defined and mode == 'users'
  tags:
    - users
    - module1

# 🔌 MAIN ROUTER - Módulos del Roadmap

- import_playbook: playbooks/vmware.yml
  when: mode is defined and mode == 'vmware'
  tags:
    - vmware

- import_playbook: playbooks/security.yml
  when: mode is defined and mode == 'security'
  tags:
    - security
    - module2

- import_playbook: playbooks/automation.yml
  when: mode is defined and mode == 'automation'
  tags:
    - automation
    - module3

- import_playbook: playbooks/provisioning.yml
  when: mode is defined and mode == 'provisioning'
  tags:
    - provisioning
    - module4

- import_playbook: playbooks/processes.yml
  when: mode is defined and mode == 'processes'
  tags:
    - processes
    - module5

- import_playbook: playbooks/storage.yml
  when: mode is defined and mode == 'storage'
  tags:
    - storage
    - module6

# 🏢 Tareas Comunes (Banner, Validación, etc.)
# Este play se ejecuta siempre para mostrar el banner y validar el modo.
- name: "🎯 MAIN ROUTER - Tareas Comunes"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  
  vars:
    project_name: "Infraestructura Ansible - vCenter"
    project_version: "2.1.0"
    available_modes:
      - vmware
      - users
      - security
      - automation
      - provisioning
      - processes
      - storage
  
  pre_tasks:
    - name: "📊 Mostrar banner de inicio"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         🚀 ANSIBLE MAIN ROUTER - vCenter Edition 🚀         ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Proyecto: {{ project_name }}
          ║ Versión: {{ project_version }}
          ║ Modo: {{ mode | default('help') | upper }}
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always

    - name: "🔍 Validar modo de ejecución"
      when: mode is defined
      assert:
        that:
          - mode in available_modes
        fail_msg: "❌ MODO NO VÁLIDO: '{{ mode }}'. Modos disponibles: {{ available_modes | join(', ') }}"
      tags:
        - always
  
  post_tasks:
    - name: "✅ Mostrar resumen final"
      when: mode is defined and mode in available_modes
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║              ✅ EJECUCIÓN DEL MODO {{ mode | upper }} COMPLETADA             ║
          ╚════════════════════════════════════════════════════════════╝
      tags:
        - always