---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MAIN ROUTER - Punto de Entrada Principal de Ansible       ║
# ║  Versión: 2.2.0 - Corregido con import_playbook             ║
# ║  Uso: ansible-playbook main.yml -e "mode=<mode>"           ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "Validación de Modo de Ejecución"
  hosts: localhost
  gather_facts: no
  vars:
    available_modes:
      - users
      - security
      - security_windows
      - automation
      - provisioning
      - services
      - storage
      - vmware
  tasks:
    - name: "Verificar que el modo es válido"
      ansible.builtin.assert:
        that:
          - mode is defined
          - mode in available_modes
        fail_msg: "❌ ERROR: Modo '{{ mode | default('NO ESPECIFICADO') }}' no es válido. Modos disponibles: {{ available_modes | join(', ') }}"
      run_once: true

- import_playbook: playbooks/user_management.yml
  when: mode is defined and mode == 'users'

- import_playbook: playbooks/security.yml
  when: mode is defined and mode == 'security'

- import_playbook: playbooks/security_windows.yml
  when: mode is defined and mode == 'security_windows'

- import_playbook: playbooks/automation.yml
  when: mode is defined and mode == 'automation'

- import_playbook: playbooks/provisioning.yml
  when: mode is defined and mode == 'provisioning'

- import_playbook: playbooks/services.yml
  when: mode is defined and mode == 'services'

- import_playbook: playbooks/storage.yml
  when: mode is defined and mode == 'storage'

- import_playbook: playbooks/vmware.yml
  when: mode is defined and mode == 'vmware'
