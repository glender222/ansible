---
# ╔══════════════════════════════════════════════════════════════╗
# ║  MAIN ROUTER - Punto de Entrada Principal de Ansible       ║
# ║  Versión: 2.1.0 - Estructura Unificada                      ║
# ║  Uso: ansible-playbook main.yml -e "mode=users"            ║
# ╚══════════════════════════════════════════════════════════════╝

- name: "🎯 MAIN ROUTER - Orquestación Centralizada con Vault"
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  vars:
    project_name: "Infraestructura Ansible - vCenter"
    project_version: "2.1.0"
    environment: "{{ env | default('staging') }}"
    available_modes:
      - users
      - security
      - security_windows
      - automation
      - provisioning
      - services
      - storage
      - vmware

  pre_tasks:
    - name: "📊 Mostrar banner de inicio"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         🚀 ANSIBLE MAIN ROUTER - vCenter Edition 🚀         ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Proyecto: {{ project_name }}
          ║ Versión: {{ project_version }}
          ║ Modo: {{ mode | default('help') | upper }}
          ╚════════════════════════════════════════════════════════════╝
      tags: [always]

    - name: "🔍 Validar modo de ejecución"
      run_once: true
      assert:
        that:
          - mode is defined
          - mode in available_modes
        fail_msg: |
          ❌ ERROR: Modo '{{ mode | default('NO ESPECIFICADO') }}' no válido
          📋 Modos disponibles: {{ available_modes | join(', ') }}

  tasks:
    - name: "🔌 Módulo de Gestión de Usuarios"
      include_tasks: playbooks/user_management.yml
      when: mode == 'users'

    - name: "🔐 Módulo de Seguridad (Linux)"
      include_tasks: playbooks/security.yml
      when: mode == 'security'

    - name: "🔐 Módulo de Seguridad (Windows)"
      include_tasks: playbooks/security_windows.yml
      when: mode == 'security_windows'

    - name: "⚙️ Módulo de Automatización"
      include_tasks: playbooks/automation.yml
      when: mode == 'automation'

    - name: "📦 Módulo de Aprovisionamiento"
      include_tasks: playbooks/provisioning.yml
      when: mode == 'provisioning'

    - name: "🔧 Módulo de Servicios"
      include_tasks: playbooks/services.yml
      when: mode == 'services'

    - name: "💾 Módulo de Almacenamiento"
      include_tasks: playbooks/storage.yml
      when: mode == 'storage'

    - name: "🌐 Módulo de VMware (Listar VMs)"
      include_tasks: playbooks/vmware.yml
      when: mode == 'vmware'

  post_tasks:
    - name: "✅ Mostrar resumen final"
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║              ✅ EJECUCIÓN COMPLETADA CON ÉXITO             ║
          ╠════════════════════════════════════════════════════════════╣
          ║ Modo: {{ mode | upper }}
          ╚════════════════════════════════════════════════════════════╝
      tags: [always]
