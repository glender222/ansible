---
# 🐧 VARIABLES PARA VMs LINUX - GESTIÓN DE USUARIOS

# 📝 INFORMACIÓN
os_family: "Linux"
os_type: "linux"

# 🔐 GRUPOS DEL SISTEMA
system_groups:
  - name: admins
    gid: 2001
  
  - name: developers
    gid: 2002
  
  - name: auditors
    gid: 2003

# 👤 USUARIOS DEL SISTEMA  
system_users:
  # === ADMINISTRADORES ===
  - name: admin1
    uid: 1001
    group: admins
    groups: 
      - sudo
    comment: "Administrador Principal"
    shell: /bin/bash
    create_home: true
    password: "{{ 'Admin123!' | password_hash('sha512') }}"
  
  - name: admin2
    uid: 1002
    group: admins
    groups:
      - sudo
    comment: "Administrador Secundario"
    shell: /bin/bash
    create_home: true
    password: "{{ 'Admin123!' | password_hash('sha512') }}"
  
  # === DESARROLLADORES ===
  - name: developer1
    uid: 1101
    group: developers
    comment: "Developer Backend"
    shell: /bin/bash
    create_home: true
    password: "{{ 'Dev123!' | password_hash('sha512') }}"
  
  - name: developer2
    uid: 1102
    group: developers
    comment: "Developer Frontend"
    shell: /bin/bash
    create_home: true
    password: "{{ 'Dev123!' | password_hash('sha512') }}"
  
  # === AUDITORES ===
  - name: auditor1
    uid: 1201
    group: auditors
    comment: "Auditor de Sistemas"
    shell: /bin/bash
    create_home: true
    password: "{{ 'Audit123!' | password_hash('sha512') }}"

# 🔧 CONFIGURACIÓN DEL ROL
users_cron_allow: true
users_create_home: true
users_shell: "/bin/bash"
